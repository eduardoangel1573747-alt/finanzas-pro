<!-- V2.3.1 -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fin Flow FPR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex items-center justify-center px-4 transition-colors duration-300">
    <div id="authSection" class="w-full">
        <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-md mx-auto space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-emerald-500/10 rounded-full text-emerald-400 mb-1">
                    <i class="fa-solid fa-wallet text-3xl"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-wide text-slate-100">Iniciar Sesión</h2>
                <p id="authSubtitle" class="text-xs text-slate-400">Ingresa a tu panel de gestión financiera</p>
            </div>
            <div id="authSuccess" class="hidden text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/50 p-3 rounded-lg text-center font-medium"></div>
            <!-- Formulario de LOGIN -->
           <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Campo: Correo Electrónico -->
                <div>
                    <label for="loginUsername" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                        Correo Electrónico
                    </label>
                    <div class="relative">
                        <input type="email" 
                            id="loginUsername" 
                            required 
                            autocomplete="email"
                            placeholder="ejemplo@correo.com" 
                            class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    </div>
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label for="loginPassword" class="text-xs font-medium text-slate-300 block tracking-wide">
                            Contraseña
                        </label>
                        <button type="button" 
                                onclick="showForgotPasswordStep1()" 
                                class="text-xs text-emerald-400 hover:text-emerald-300 font-medium transition-colors duration-150">
                            ¿Olvidaste tu contraseña?
                        </button>
                    </div>
                    <div class="relative">
                        <input type="password" 
                            id="loginPassword" 
                            required 
                            placeholder="••••••••" 
                            class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    </div>
                </div>

                <!-- Contenedor de Error -->
                <div id="loginError" class="hidden text-xs text-rose-300 bg-rose-950/40 border border-rose-800/60 p-3 rounded-xl text-center backdrop-blur-sm transition-all duration-200"></div>

                <!-- Botón de Envío -->
                <button type="submit" 
                        class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-sm transition-all duration-200 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/35 hover:-translate-y-0.5 active:translate-y-0">
                    Ingresar
                </button>
            </form>
            <!-- Formulario de REGISTRO -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-4">
                
                <!-- Campos Nombres y Apellidos en Grilla -->
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="regFirstName" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                            Nombres
                        </label>
                        <input type="text" 
                            id="regFirstName" 
                            required 
                            placeholder="Juan" 
                            class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    </div>
                    <div>
                        <label for="regLastName" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                            Apellidos
                        </label>
                        <input type="text" 
                            id="regLastName" 
                            required 
                            placeholder="Pérez" 
                            class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3 py-2 text-xs text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    </div>
                </div>

                <!-- Campo: Usuario -->
                <div>
                    <label for="regUsername" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                        Usuario
                    </label>
                    <input type="text"
                        id="regUsername"
                        required
                        minlength="3"
                        pattern="[A-Za-z0-9_.-]+"
                        autocomplete="username"
                        placeholder="juan123"
                        class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    <p class="text-[10px] text-slate-500 mt-1">Usa letras, números, punto, guion o guion bajo.</p>
                </div>

                <!-- Campo: Correo Electrónico -->
                <div>
                    <label for="regEmail" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                        Correo Electrónico
                    </label>
                    <input type="email" 
                        id="regEmail" 
                        required 
                        placeholder="juan@correo.com" 
                        class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                </div>

                <!-- Campo: Contraseña -->
                <div>
                    <label for="regPassword" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                        Contraseña
                    </label>
                    <input type="password" 
                        id="regPassword" 
                        required 
                        placeholder="••••••••" 
                        class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2 text-xs text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                </div>

                <!-- Contenedor de Error -->
                <div id="registerError" class="hidden text-xs text-rose-300 bg-rose-950/40 border border-rose-800/60 p-2.5 rounded-xl text-center backdrop-blur-sm transition-all duration-200"></div>

                <!-- Botón de Envío -->
                <button type="submit" 
                        class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-xs transition-all duration-200 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/35 hover:-translate-y-0.5 active:translate-y-0 mt-2">
                    Crear Cuenta
                </button>

            </form>
            <!-- Formulario de RECUPERACIÓN (Vía Email Oficial de Firebase) -->
            <form id="forgotForm" onsubmit="handleForgotPassword(event)" class="hidden space-y-5">
                
                <!-- Texto Descriptivo Informativo -->
                <p class="text-xs text-slate-300 leading-relaxed bg-slate-800/40 border border-slate-700/60 p-3 rounded-xl">
                    Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
                </p>

                <div class="space-y-4">
                    <!-- Campo: Correo Electrónico -->
                    <div>
                        <label for="forgotSearchInput" class="text-xs font-medium text-slate-300 block mb-1.5 tracking-wide">
                            Correo Electrónico
                        </label>
                        <input type="email" 
                            id="forgotSearchInput" 
                            required 
                            placeholder="ejemplo@correo.com" 
                            class="w-full bg-slate-800/80 border border-slate-600/80 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-400/70 focus:outline-none focus:border-emerald-400 focus:ring-2 focus:ring-emerald-400/20 transition-all duration-200 shadow-sm">
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" 
                            class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-xs transition-all duration-200 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/35 hover:-translate-y-0.5 active:translate-y-0">
                        Enviar Enlace de Recuperación
                    </button>
                </div>

                <!-- Contenedor de Error -->
                <div id="forgotError" class="hidden text-xs text-rose-300 bg-rose-950/40 border border-rose-800/60 p-3 rounded-xl text-center backdrop-blur-sm transition-all duration-200"></div>

                <!-- Botón Secundario: Volver -->
                <button type="button" 
                        onclick="cancelForgot()" 
                        class="w-full bg-slate-800/60 hover:bg-slate-700/80 text-slate-300 border border-slate-700/80 font-medium py-2 px-4 rounded-xl text-xs transition-all duration-200 active:scale-[0.99]">
                    Volver
                </button>

            </form>
           <div class="pt-4 mt-2 border-t border-slate-700/60 text-center">
            <p id="toggleAuthText" class="text-xs text-slate-400">
                ¿No tienes una cuenta? 
                <button onclick="toggleAuthMode()" 
                        type="button"
                        class="text-emerald-400 font-medium hover:text-emerald-300 hover:underline ml-1 transition-colors duration-150 focus:outline-none focus:ring-1 focus:ring-emerald-400/40 rounded-sm">
                    Crear Cuenta
                </button>
            </p>
        </div>
        </div>
    </div>
    
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
        getAuth, 
        signInWithEmailAndPassword, 
        createUserWithEmailAndPassword, 
        sendPasswordResetEmail,
        onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // Configuración Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDIM1mBM9AuficthPXlpjwMcNTi5H63PW4",
        authDomain: "proyecto-web-9f7fc.firebaseapp.com",
        projectId: "proyecto-web-9f7fc",
        storageBucket: "proyecto-web-9f7fc.firebasestorage.app",
        messagingSenderId: "325159836538",
        appId: "1:325159836538:web:9907100d419ef41f2494c3",
        measurementId: "G-MJV4XPPJYR"
    };
    // Inicialización
    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    // Asignación directa a funciones globales para window.dbMethods
    window.dbMethods = { 
        doc, 
        getDoc, 
        setDoc, 
        collection,
        query,
        where,
        getDocs,
        onAuthStateChanged,
        signInWithEmailAndPassword: (auth, email, pass) => signInWithEmailAndPassword(auth, email, pass),
        createUserWithEmailAndPassword: (auth, email, pass) => createUserWithEmailAndPassword(auth, email, pass),
        sendPasswordResetEmail: (auth, email) => sendPasswordResetEmail(auth, email)
    };
    // Cargar dinámicamente scriptL.js una vez que window.dbMethods está listo
    const scriptL = document.createElement('script');
    scriptL.src = "scriptL.js";
    document.head.appendChild(scriptL);
</script>
</body>
</html>
