<!-- V1.0 -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Fin Flow FPR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<link rel="stylesheet" href="styles.css">
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex items-center justify-center px-4 transition-colors duration-300">

    <div id="authSection" class="w-full">
        <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-slate-700 shadow-2xl max-w-md mx-auto space-y-6">
            
            <div class="text-center space-y-2">
                <div class="inline-flex p-3 bg-emerald-500/10 rounded-full text-emerald-400 mb-1">
                    <i class="fa-solid fa-wallet text-3xl"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold tracking-wide text-slate-100">Iniciar Sesión</h2>
                <p id="authSubtitle" class="text-xs text-slate-400">Ingresa a tu panel de gestión financiera</p>
            </div>

            <div id="authSuccess" class="hidden text-xs text-emerald-400 bg-emerald-950/50 border border-emerald-800/50 p-3 rounded-lg text-center font-medium"></div>

            <!-- Formulario de LOGIN -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="text-xs font-semibold text-slate-300 block mb-1">Nombre de Usuario o Correo</label>
                    <input type="text" id="loginUsername" required placeholder="Ej. juan123 o juan@correo.com" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-400 text-slate-100">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-xs font-semibold text-slate-300 block">Contraseña</label>
                        <button type="button" onclick="showForgotPasswordStep1()" class="text-[11px] text-emerald-400 hover:underline">¿Olvidaste tu contraseña?</button>
                    </div>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-400 text-slate-100">
                </div>
                <div id="loginError" class="hidden text-xs text-rose-400 bg-rose-950/40 border border-rose-800/50 p-2.5 rounded-lg text-center"></div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-emerald-900/30">Ingresar</button>
            </form>

            <!-- Formulario de REGISTRO -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[11px] font-semibold text-slate-300 block mb-1">Nombres</label>
                        <input type="text" id="regFirstName" required placeholder="Juan" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-300 block mb-1">Apellidos</label>
                        <input type="text" id="regLastName" required placeholder="Pérez" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-2">
                        <label class="text-[11px] font-semibold text-slate-300 block mb-1">Nombre de Usuario</label>
                        <input type="text" id="regUsername" required placeholder="juan123" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                    </div>
                    <div>
                        <label class="text-[11px] font-semibold text-slate-300 block mb-1">Edad</label>
                        <input type="number" id="regAge" min="12" max="120" required placeholder="25" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                    </div>
                </div>
                <div>
                    <label class="text-[11px] font-semibold text-slate-300 block mb-1">Correo Electrónico</label>
                    <input type="email" id="regEmail" required placeholder="juan@correo.com" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                </div>
                <div class="space-y-2 border-t border-slate-700/60 pt-2">
                    <label class="text-[11px] font-semibold text-slate-300 block mb-1">Pregunta de Seguridad</label>
                    <select id="regSecurityQuestion" required class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                        <option value="" disabled selected>Selecciona una pregunta...</option>
                        <option value="mascota">¿Cuál es el nombre de tu primera mascota?</option>
                        <option value="ciudad">¿En qué ciudad naciste?</option>
                        <option value="colegio">¿Cuál es el nombre de tu primera escuela?</option>
                        <option value="comida">¿Cuál es tu comida favorita?</option>
                    </select>
                    <input type="text" id="regSecurityAnswer" required placeholder="Tu respuesta secreta" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="password" id="regPassword" required placeholder="Contraseña" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                    <input type="password" id="regConfirmPassword" required placeholder="Confirmar" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs focus:outline-none focus:border-emerald-400 text-slate-100">
                </div>
                <div id="registerError" class="hidden text-xs text-rose-400 bg-rose-950/40 border border-rose-800/50 p-2 rounded-lg text-center"></div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-lg">Crear Cuenta</button>
            </form>

            <!-- Formulario de RECUPERACIÓN -->
            <form id="forgotForm" onsubmit="handleForgotPassword(event)" class="hidden space-y-4">
                <input type="hidden" id="recoveryTargetUser">
                <div id="forgotStep1" class="space-y-3">
                    <input type="text" id="forgotSearchInput" required placeholder="Usuario o Correo" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-400 text-slate-100">
                    <button type="button" onclick="verifyUserForRecovery()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-lg">Buscar Cuenta</button>
                </div>
                <div id="forgotStep2" class="hidden space-y-3">
                    <p id="forgotQuestionLabel" class="text-xs font-semibold text-emerald-400 bg-slate-700/50 p-2.5 rounded-lg border border-slate-600"></p>
                    <input type="text" id="forgotAnswerInput" required placeholder="Tu respuesta" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-400 text-slate-100">
                    <input type="password" id="forgotNewPassword" required placeholder="Nueva Contraseña" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-sm focus:outline-none focus:border-emerald-400 text-slate-100">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-lg">Restablecer Contraseña</button>
                </div>
                <div id="forgotError" class="hidden text-xs text-rose-400 bg-rose-950/40 border border-rose-800/50 p-2.5 rounded-lg text-center"></div>
                <button type="button" onclick="cancelForgot()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-semibold py-2 rounded-lg text-xs transition">Volver</button>
            </form>

            <div class="pt-3 border-t border-slate-700 text-center">
                <p id="toggleAuthText" class="text-xs text-slate-400">
                    ¿No tienes una cuenta? <button onclick="toggleAuthMode()" class="text-emerald-400 font-semibold hover:underline ml-1">Crear Cuenta</button>
                </p>
            </div>
        </div>
    </div>

    <script>
        const usersDB = JSON.parse(localStorage.getItem('finances_users_db')) || {};
        const securityQuestionsMap = { mascota: "¿Cuál es el nombre de tu primera mascota?", ciudad: "¿En qué ciudad naciste?", colegio: "¿Cuál es el nombre de tu primera escuela?", comida: "¿Cuál es tu comida favorita?" };
        let isRegisterMode = false;

        // Redirigir si ya está logueado
        if(localStorage.getItem('finances_session_user')) window.location.href = 'index.html';

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById('loginForm').classList.toggle('hidden', isRegisterMode);
            document.getElementById('registerForm').classList.toggle('hidden', !isRegisterMode);
            document.getElementById('authTitle').innerText = isRegisterMode ? 'Crear Cuenta' : 'Iniciar Sesión';
            document.getElementById('toggleAuthText').innerHTML = isRegisterMode ? '¿Ya tienes una cuenta? <button onclick="toggleAuthMode()" class="text-emerald-400 font-semibold hover:underline ml-1">Ingresar</button>' : '¿No tienes una cuenta? <button onclick="toggleAuthMode()" class="text-emerald-400 font-semibold hover:underline ml-1">Crear Cuenta</button>';
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            let foundKey = Object.keys(usersDB).find(u => u === inputVal || usersDB[u].email === inputVal);
            if (!foundKey || usersDB[foundKey].password !== password) {
                const err = document.getElementById('loginError');
                err.innerText = 'Usuario o contraseña incorrectos.';
                err.classList.remove('hidden');
                return;
            }
            localStorage.setItem('finances_session_user', foundKey);
            window.location.href = 'index.html';
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value.trim().toLowerCase();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            if (usersDB[username] || Object.values(usersDB).some(u => u.email === email)) {
                alert('El usuario o correo ya existe.'); return;
            }
            usersDB[username] = {
                firstName: document.getElementById('regFirstName').value,
                lastName: document.getElementById('regLastName').value,
                email: email,
                password: document.getElementById('regPassword').value,
                securityQuestion: document.getElementById('regSecurityQuestion').value,
                securityAnswer: document.getElementById('regSecurityAnswer').value.trim().toLowerCase(),
                state: { transactions: [], incomes: [], categories: [], savingsBoxes: [], debts: [], receivables: [] }
            };
            localStorage.setItem('finances_users_db', JSON.stringify(usersDB));
            alert('¡Cuenta creada! Ya puedes iniciar sesión.');
            location.reload();
        }

        function showForgotPasswordStep1() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.remove('hidden');
        }

        function cancelForgot() {
            document.getElementById('forgotForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        function verifyUserForRecovery() {
            const searchVal = document.getElementById('forgotSearchInput').value.trim().toLowerCase();
            let foundKey = Object.keys(usersDB).find(u => u === searchVal || usersDB[u].email === searchVal);
            if (!foundKey) { alert('Cuenta no encontrada.'); return; }
            document.getElementById('recoveryTargetUser').value = foundKey;
            document.getElementById('forgotQuestionLabel').innerText = securityQuestionsMap[usersDB[foundKey].securityQuestion];
            document.getElementById('forgotStep1').classList.add('hidden');
            document.getElementById('forgotStep2').classList.remove('hidden');
        }

        function handleForgotPassword(e) {
            e.preventDefault();
            const key = document.getElementById('recoveryTargetUser').value;
            if (usersDB[key].securityAnswer === document.getElementById('forgotAnswerInput').value.trim().toLowerCase()) {
                usersDB[key].password = document.getElementById('forgotNewPassword').value;
                localStorage.setItem('finances_users_db', JSON.stringify(usersDB));
                alert('Contraseña actualizada.');
                location.reload();
            } else { alert('Respuesta incorrecta.'); }
        }
    </script>
</body>
</html>
